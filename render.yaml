services:
  - type: web
    name: resume-parser-service
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: 5432
      - key: DB_NAME
        value: resume_parser_db
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://resumeintelligenceplatform-frontend.netlify.app,https://deluxe-mermaid-dc9dad.netlify.app
